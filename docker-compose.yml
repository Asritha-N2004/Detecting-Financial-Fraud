services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://risk:${POSTGRES_PASSWORD}@database:5432/risk
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 characters}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      SPECIALIST_PROVIDER: ${SPECIALIST_PROVIDER:-deterministic}
      SPECIALIST_MODEL: ${SPECIALIST_MODEL:-}
      SPECIALIST_MODELS: ${SPECIALIST_MODELS:-}
      WORKER_ENABLED: "false"
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_SECONDS: ${JOB_RETRY_SECONDS:-2}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    environment: *app_environment
    command: ["python", "-m", "app.services.runner"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
